<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPA Europe · Surf Instructor Professional Association</title>
<meta name="description" content="SIPA Europe – Surf Instructor Professional Association. Since 2009, raising the standards of surf teaching.">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: #111;
    font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    min-height: 100vh;
  }
  main { display: flex; flex-direction: column; align-items: center; }
  .logo { width: min(420px, 80vw); height: auto; display: block; }
  .since {
    margin-top: 28px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #a8842c;
  }
  h1 {
    margin-top: 14px;
    font-size: clamp(24px, 4.2vw, 40px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.2;
    max-width: 760px;
  }
  .line { width: 56px; height: 2px; background: #a8842c; margin: 28px auto 0; }
  footer {
    margin-top: 48px;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    color: #555;
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: #111; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="SIPA – Surf Instructor Professional Association">
    <p class="since">Since 2009</p>
    <h1>Raising the standards<br>of surf teaching</h1>
    <div class="line"></div>
  </main>
  <footer><a href="https://www.sipaeurope.com">www.sipaeurope.com</a></footer>
</body>
</html>
